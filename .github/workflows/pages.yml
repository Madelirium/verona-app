name: Pubblica Verona su GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      refresh_events:
        description: Raccogli gli eventi prima di pubblicare
        type: boolean
        default: true
      refresh_bus:
        description: Raccolta manuale ATV (non eseguita dalla pianificazione)
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BRISCOLA_API_URL: ${{ vars.BRISCOLA_API_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_AUTH_ENABLED: ${{ vars.SUPABASE_AUTH_ENABLED }}
      SUPABASE_AUTH_METHOD: google
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Genera il frontend dai dati salvati
        run: npm ci && npm run build
      - name: Verifica l'applicazione
        run: npm test
      - name: Aggiorna gli eventi dalle fonti ufficiali
        id: refresh
        continue-on-error: true
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_events)
        run: npm run import:events -- --allow-partial
      - name: Aggiorna schede e pubblicazioni ATV
        id: refresh_bus
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_bus
        run: npm run import:bus -- --allow-partial
      - name: Conserva il rapporto della raccolta
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure' || steps.refresh_bus.outcome == 'success' || steps.refresh_bus.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: rapporti-fonti
          path: |
            data/import-report.json
            data/bus-import-report.json
          retention-days: 14
      - name: Verifica il risultato delle raccolte
        if: success() && (steps.refresh.outcome == 'failure' || steps.refresh_bus.outcome == 'failure')
        run: |
          echo "::warning::Una raccolta non è riuscita: i suoi dati precedenti sono conservati. Consultare i rapporti fonti."
          if [ "${{ steps.refresh.outcome }}" != "success" ] && [ "${{ steps.refresh_bus.outcome }}" != "success" ]; then
            echo "::error::Nessuna raccolta richiesta è riuscita: il sito pubblico non viene sostituito."
            exit 1
          fi
      - name: Verifica il frontend dopo la raccolta
        if: success() && (steps.refresh.outcome == 'success' || steps.refresh_bus.outcome == 'success')
        run: npm test
      - name: Conserva i dati aggiornati nel repository
        if: success() && (steps.refresh.outcome == 'success' || steps.refresh_bus.outcome == 'success')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/import-report.json data/bus.json data/bus-import-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna eventi e dati ATV dalle fonti ufficiali"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Prepara i soli file del sito
        run: |
          mkdir -p _site
          cp public/index.html _site/index.html
          cp public/vendor/leaflet.LICENSE _site/leaflet.LICENSE
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
